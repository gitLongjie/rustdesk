name: Repackage RustDesk 1.5.1 for Apple Silicon

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  DMG_NAME: rustdesk-1.5.1-aarch64.dmg

jobs:
  repackage:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download the original 1.5.1 package
        run: gh release download 1.5.1 --repo "$GITHUB_REPOSITORY" --pattern "$DMG_NAME" --dir original

      - name: Keep the original package for rollback
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: original-rustdesk-1.5.1-aarch64
          path: original/*.dmg
          retention-days: 7

      - name: Extract the original app and disk layout
        run: |
          mkdir -p "$RUNNER_TEMP/rustdesk-volume"
          hdiutil attach "original/$DMG_NAME" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/rustdesk-volume"
          ditto "$RUNNER_TEMP/rustdesk-volume" "$RUNNER_TEMP/rustdesk-stage"
          hdiutil detach "$RUNNER_TEMP/rustdesk-volume"

      - name: Reproduce the reported signature failure
        run: |
          set +e
          "$RUNNER_TEMP/rustdesk-stage/RustDesk.app/Contents/MacOS/RustDesk" --version > before.log 2>&1
          launch_status=$?
          set -e
          cat before.log
          test "$launch_status" -ne 0
          grep -q 'different Team IDs' before.log

      - name: Normalize signatures and check startup
        run: |
          app="$RUNNER_TEMP/rustdesk-stage/RustDesk.app"
          bash ./.github/scripts/sign-macos-app.sh "$app" - ./flutter/macos/Runner/Release.entitlements
          test "$("$app/Contents/MacOS/RustDesk" --version)" = '1.5.1'
          "$app/Contents/MacOS/RustDesk" --no-server > startup.log 2>&1 &
          app_pid=$!
          sleep 10
          cat startup.log
          kill -0 "$app_pid"
          kill "$app_pid"
          wait "$app_pid" || true

      - name: Create and verify the replacement DMG
        run: |
          mkdir repaired
          hdiutil create -volname RustDesk -srcfolder "$RUNNER_TEMP/rustdesk-stage" -format UDZO "repaired/$DMG_NAME"
          hdiutil attach "repaired/$DMG_NAME" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/rustdesk-volume"
          app="$RUNNER_TEMP/rustdesk-volume/RustDesk.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$("$app/Contents/MacOS/RustDesk" --version)" = '1.5.1'
          hdiutil detach "$RUNNER_TEMP/rustdesk-volume"
          shasum -a 256 "repaired/$DMG_NAME"

      - name: Replace only the Apple Silicon asset in release 1.5.1
        run: gh release upload 1.5.1 "repaired/$DMG_NAME" --repo "$GITHUB_REPOSITORY" --clobber
